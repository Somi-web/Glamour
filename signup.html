<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Glamo | Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="reg-nav">
        <a href="index.html" class="reg-logo">Glamour</a>
        <a href="#" class="reg-nav-btn">
            <span class="reg-nav-dot"></span>
            Official Registration
        </a>
  </nav>

  <!-- REGISTER CARD -->
  <main class="reg-main">
        <div class="reg-card">

            <!-- Badge -->
            <div class="reg-badge">
                <span class="reg-badge-dot"></span>
                Glamour &bull; Register
            </div>

            <!-- Heading -->
            <h1 class="reg-heading">Create your account</h1>
            <p class="reg-subtext">Fill in details to get started.</p>

            <!-- Form Fields -->
            <div class="reg-form">

                <div class="reg-field">
                    <label class="reg-label">Name</label>
                    <input type="text" class="reg-input" placeholder="Your name"/>
                </div>

                <div class="reg-field">
                    <label class="reg-label">Email</label>
                    <input type="email" class="reg-input" placeholder="you@example.com"/>
                </div>

                <div class="reg-field">
                    <label class="reg-label">Password</label>
                    <input type="password" class="reg-input" placeholder="Enter password"/>
                </div>

                <!-- Register Button (link) -->
                <a href="login.html" class="reg-btn-primary">
                    <i class="fas fa-user-check"></i>
                    Register
                </a>

                <!-- Back to Login Button (link) -->
                <a href="login.html" class="reg-btn-secondary">
                    <i class="fas fa-arrow-left"></i>
                    Back to Login
                </a>

            </div>

        </div>
  </main>

  <!-- FOOTER -->
  <footer class="reg-footer">
    &copy; 2026 Glamo. All Rights Reserved.
  </footer>



 <script src="signup.js"></script>

</body>
</html>
